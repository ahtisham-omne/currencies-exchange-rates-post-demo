<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test PRM</title>
<link rel="stylesheet" href="/src/styles/index.css">
</head><body>
<div id="root"></div>
<script type="module">
import { createRoot } from "react-dom/client";
import React from "react";
import { PricingRulesManageModal } from "/src/app/components/quote-details/PricingRulesManageModal.tsx";

window.addEventListener('error', e => { document.title = 'ERR:' + e.message; console.error('caught:', e); });
window.addEventListener('unhandledrejection', e => { document.title = 'REJ:' + (e.reason && e.reason.message); console.error('rej:', e); });

const Wrapper = () => {
  return React.createElement(PricingRulesManageModal, {
    isOpen: true,
    onClose: () => {},
    readOnly: false,
    customerName: "Test Customer",
    startEmpty: false
  });
};

createRoot(document.getElementById("root")).render(React.createElement(Wrapper));
</script>
</body></html>
